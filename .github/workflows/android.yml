name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build:android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: mv android/app/build/outputs/apk/debug/app-debug.apk OfflinePay-Wallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflinePay-Wallet-apk
          path: OfflinePay-Wallet.apk

      - name: Publish versioned release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" OfflinePay-Wallet.apk \
            --title "OfflinePay Wallet ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md

      - name: Publish as the "latest" release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OfflinePay-Wallet.apk --prerelease \
            --title "OfflinePay Wallet (latest build)" \
            --notes "Development build from ${{ github.sha }}. For the stable version, use the newest numbered release."
