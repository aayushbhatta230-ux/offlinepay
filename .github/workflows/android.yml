name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build:android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: mv android/app/build/outputs/apk/debug/app-debug.apk OfflinePay-Wallet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OfflinePay-Wallet-apk
          path: OfflinePay-Wallet.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OfflinePay-Wallet.apk \
            --title "OfflinePay Wallet (latest build)" \
            --notes "Debug APK built from ${{ github.sha }}. Install on Android, then enter the laptop's server address shown by \`npm start\`."
